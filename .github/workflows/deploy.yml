name: Deploy to Sakura Internet

# main ブランチに push されたら自動でさくらのレンタルサーバへ FTP 同期します。
# 手動実行（Actions タブの Run workflow）も可能です。
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: FTP でさくらへ同期
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SAKURA_FTP_SERVER }}
          username: ${{ secrets.SAKURA_FTP_USER }}
          password: ${{ secrets.SAKURA_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          # さくらの公開フォルダ（~/www/mokikaku/）へアップロード
          server-dir: /www/mokikaku/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            DEPLOY_SETUP.md
