name: Deploy to Sakura Internet

# main ブランチに push されたら自動でさくらのレンタルサーバへ FTP 同期します。
# 手動実行（Actions タブの Run workflow）も可能です。
# 転送には lftp を使用（さくらのFTPサーバと相性が良く堅牢）。
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: lftp をインストール
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: lftp でさくらへ同期
        env:
          SERVER: ${{ secrets.SAKURA_FTP_SERVER }}
          USER_NAME: ${{ secrets.SAKURA_FTP_USER }}
          PASSWORD: ${{ secrets.SAKURA_FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode on;
            set ftp:prefer-epsv no;
            set ftp:fix-pasv-address yes;
            set net:max-retries 2;
            set net:timeout 20;
            set net:connection-limit 1;
            open -u '$USER_NAME','$PASSWORD' 'ftp://$SERVER';
            mirror --reverse --delete --verbose \
              --exclude .git/ \
              --exclude .github/ \
              --exclude README.md \
              --exclude DEPLOY_SETUP.md \
              ./ /home/kzshop/www/mokikaku/;
          "
