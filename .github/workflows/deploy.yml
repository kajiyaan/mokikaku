name: Deploy to Sakura Internet

# main ブランチに push されたら自動でさくらのレンタルサーバへ SFTP 同期します。
# 手動実行（Actions タブの Run workflow）も可能です。
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: SFTP でさくらへ同期
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: ${{ secrets.SAKURA_FTP_SERVER }}
          username: ${{ secrets.SAKURA_FTP_USER }}
          password: ${{ secrets.SAKURA_FTP_PASSWORD }}
          port: 22
          local_path: './*'
          remote_path: '/home/kzshop/www/mokikaku/'
          sftp_only: true
          exclude_list: |
            .git
            .github
            README.md
